# init-devbox 默认配置
# 复制为 config.toml 进行自定义，自定义值会覆盖此文件中的默认值

[region]
# "cn" | "overseas" | ""（空则交互询问）
value = ""

[python]
manager = "uv"
versions = ["3.12", "3.13"]
default = "3.12"

[node]
manager = "fnm"
# 指定 Node.js 版本号（如 "22"），留空则安装最新 LTS
lts = ""

[node.package_managers]
pnpm = true
bun = true

[docker]
# "group"（默认，添加用户到 docker 组）或 "rootless"
mode = "group"

[mirrors]
# 留空 = 根据 region 自动填充；手动填写则覆盖 region 预设
apt = ""
npm = ""
pypi = ""
docker_ce = ""
docker_hub = ""
github_proxy = ""
